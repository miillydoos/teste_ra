<script>
/* ============================================================
   CORREÇÃO — MINIATURA DO ENCODER
   ============================================================ */

const THUMB_ENCODER =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#111"/>
      <circle cx="100" cy="100" r="55" fill="#222" stroke="#e50000" stroke-width="6"/>
      <circle cx="100" cy="100" r="25" fill="#fff"/>
      <text x="100" y="180"
            text-anchor="middle"
            fill="#fff"
            font-family="Arial"
            font-size="18">
        ENCODER
      </text>
    </svg>
  `);


/* ============================================================
   SEUS SENSORES
   ============================================================ */

const SENSORES = {

  velocidade: {
    lon: 316.4,
    lat: -13.7,

    label: "Encoder rotativo",

    titulo: "Encoder Rotativo",

    sub: "Na extremidade do eixo-árvore, acoplado por engrenagem",

    thumb: THUMB_ENCODER,

    texto: [
      'Um <em class="hl">encoder rotativo incremental</em> gira junto com o eixo-árvore, acoplado por uma <em class="hl">engrenagem fabricada pela equipe</em> e preso a uma <em class="hl">chapa de fixação</em> no torno.',

      'O ESP32 conta os pulsos para calcular a <em class="hl">rotação (RPM)</em>. A ordem entre os canais mostra o <em class="hl">sentido de giro</em> e os pulsos permitem acompanhar o funcionamento da máquina.'
    ],

    pills: [
      "Leitura de RPM",
      "Quadratura A/B",
      "Sentido de giro",
      "GPIO 25 / 26"
    ]
  },


  ultrassonico: {

    lon: 307.4,
    lat: -19.1,

    label: "Sensor ultrassônico",

    titulo: "Sensor Ultrassônico",

    sub: "Módulo HC-SR04 — 40 kHz",

    thumb: THUMB_ULTRASSONICO,

    texto: [
      'Emite um pulso sonoro <em class="hl">acima da faixa audível</em> e mede o tempo até o eco voltar. Esse tempo é convertido em <em class="hl">distância</em>.',

      'Pode ser utilizado para acompanhar a <em class="hl">posição do carro</em>, detectar peças ou obstáculos e auxiliar no monitoramento do equipamento.'
    ],

    pills: [
      "Alcance 2 cm – 4 m",
      "Resolução ~3 mm",
      "Alimentação 5 V",
      "Trig / Echo"
    ]
  },


  corrente: {

    lon: 150.8,
    lat: -19.3,

    label: "Sensor de corrente",

    titulo: "Sensor de Corrente Não Invasivo",

    sub: "Posição 7K4 no quadro de comando",

    thumb: THUMB_CORRENTE,

    texto: [
      'É um <em class="hl">TC de núcleo partido</em> tipo clamp. O núcleo abraça o condutor e mede a corrente por <em class="hl">indução eletromagnética</em>, sem cortar ou desconectar o cabo.',

      'A instalação é mais <em class="hl">segura e rápida</em>, permitindo acompanhar a corrente do motor sem contato elétrico direto.'
    ],

    pills: [
      "Núcleo partido",
      "Sem cortar o cabo",
      "Indução eletromagnética",
      "Até 100 A",
      "Saída 50 mA (SCT-013)"
    ]
  }
};


/* ============================================================
   CENAS
   ============================================================ */

function spotSensor(s) {

  return {
    lon: s.lon,
    lat: s.lat,
    label: s.label,
    type: "info",
    info: s
  };

}


const SCENES = [

  {
    name: "Frente do torno",

    img: IMG_1,

    startLon: 310,

    hotspots: [

      {
        lon: 30,
        lat: -2,
        label: "Ir para trás do torno",
        target: 1,
        targetLon: 195,
        type: "nav"
      },

      spotSensor(SENSORES.velocidade),

      spotSensor(SENSORES.ultrassonico)
    ]
  },


  {
    name: "Atrás do torno",

    img: IMG_2,

    startLon: 152,

    hotspots: [

      {
        lon: 195,
        lat: -3,
        label: "Voltar para a frente do torno",
        target: 0,
        targetLon: 310,
        type: "nav"
      },

      spotSensor(SENSORES.corrente)
    ]
  }

];


/* ============================================================
   VARIÁVEIS PRINCIPAIS
   ============================================================ */

let currentSceneIndex = 0;

let lon = SCENES[0].startLon;
let lat = 0;

let targetLon = lon;
let targetLat = 0;

let fov = 90;
let fovTarget = 90;

const FOV_PADRAO = 90;
const FOV_ZOOM = 38;


/* ============================================================
   THREE.JS
   ============================================================ */

const canvas = document.getElementById("viewer");

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);


const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  fov,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);


const geometry = new THREE.SphereGeometry(
  500,
  60,
  40
);

geometry.scale(-1, 1, 1);


const loader = new THREE.TextureLoader();

let sphereMesh = null;


/* ============================================================
   REDIMENSIONAMENTO
   ============================================================ */

function resize() {

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();
}


/* ============================================================
   CONVERSÃO LONGITUDE / LATITUDE
   ============================================================ */

function lonLatToVector(
  lonDeg,
  latDeg,
  radius
) {

  const phi =
    THREE.MathUtils.degToRad(
      90 - latDeg
    );

  const theta =
    THREE.MathUtils.degToRad(
      lonDeg
    );

  const x =
    radius *
    Math.sin(phi) *
    Math.cos(theta);

  const y =
    radius *
    Math.cos(phi);

  const z =
    radius *
    Math.sin(phi) *
    Math.sin(theta);

  return new THREE.Vector3(
    x,
    y,
    z
  );
}


/* ============================================================
   CARREGAR CENA
   ============================================================ */

function loadScene(index, arriveLon) {

  if (
    index < 0 ||
    index >= SCENES.length
  ) {
    console.error(
      "Cena inválida:",
      index
    );

    return;
  }


  const s = SCENES[index];

  const loading =
    document.getElementById("loading");

  loading.style.display = "flex";


  loader.load(

    s.img,

    function(texture) {

      const material =
        new THREE.MeshBasicMaterial({
          map: texture
        });


      if (sphereMesh) {

        scene.remove(sphereMesh);

        sphereMesh.material.dispose();

      }


      sphereMesh =
        new THREE.Mesh(
          geometry,
          material
        );

      scene.add(sphereMesh);


      loading.style.display =
        "none";
    },


    undefined,


    function(error) {

      console.error(
        "Erro ao carregar panorama:",
        error
      );

      loading.innerHTML =
        "<div>Erro ao carregar o ambiente 360.</div>";
    }

  );


  currentSceneIndex = index;


  lon =
    targetLon =
      arriveLon !== undefined
        ? arriveLon
        : s.startLon;


  lat = targetLat = 0;


  document.getElementById(
    "scene-name"
  ).textContent = s.name;


  document
    .querySelectorAll(".mm-node")
    .forEach(function(n) {

      n.classList.toggle(
        "active",
        Number(n.dataset.scene) === index
      );

    });


  renderHotspots();
}


/* ============================================================
   HOTSPOTS
   ============================================================ */

const hsContainer =
  document.getElementById("app");

let hotspotEls = [];


function renderHotspots() {

  hotspotEls.forEach(
    function(el) {
      el.remove();
    }
  );

  hotspotEls = [];


  const s =
    SCENES[currentSceneIndex];


  s.hotspots.forEach(
    function(hs) {

      const isInfo =
        hs.type === "info";


      const el =
        document.createElement("div");


      el.className =
        "hotspot " +
        (isInfo ? "info" : "nav");


      el.innerHTML = `

        <div class="hotspot-ring">

          <span class="orbit"></span>

          <span class="wave w1"></span>

          <span class="wave w2"></span>

          <span class="wave w3"></span>

          <span class="core"></span>

        </div>

        <div class="hotspot-label">
          ${hs.label}
        </div>

      `;


      el.addEventListener(
        "click",
        function(e) {

          e.stopPropagation();


          if (isInfo) {

            zoomToSpot(hs);

            openSensor(
              hs.info,
              el
            );

          } else {

            transitionTo(
              hs.target,
              hs.targetLon
            );

          }

        }
      );


      hsContainer.appendChild(el);

      hotspotEls.push(el);

      hs._el = el;

    }
  );
}


/* ============================================================
   ZOOM
   ============================================================ */

function zoomToSpot(hs) {

  const delta =
    ((hs.lon - lon + 540) % 360) - 180;

  targetLon =
    lon + delta;

  targetLat =
    hs.lat;

  fovTarget =
    FOV_ZOOM;
}


function resetZoom() {

  fovTarget =
    FOV_PADRAO;

}


/* ============================================================
   CARTÃO DOS SENSORES
   ============================================================ */

const card =
  document.getElementById(
    "sensor-card"
  );


function markActive(el) {

  hotspotEls.forEach(
    function(h) {

      h.classList.toggle(
        "active",
        h === el
      );

    }
  );
}


function openSensor(info, el) {

  markActive(el || null);


  document.getElementById(
    "sc-img"
  ).src = info.thumb;


  document.getElementById(
    "sc-img"
  ).alt = info.titulo;


  document.getElementById(
    "sc-title"
  ).textContent =
    info.titulo;


  document.getElementById(
    "sc-sub"
  ).innerHTML =
    info.sub;


  document.getElementById(
    "sc-body"
  ).innerHTML =

    info.texto
      .map(
        function(t) {
          return (
            '<p class="sc-txt">' +
            t +
            "</p>"
          );
        }
      )
      .join("") +

    '<div class="sc-pills">' +

    info.pills
      .map(
        function(p) {
          return (
            '<span class="sc-pill">' +
            p +
            "</span>"
          );
        }
      )
      .join("") +

    "</div>";


  card.classList.add("open");
}


function closeSensor() {

  card.classList.remove(
    "open"
  );

  markActive(null);

  resetZoom();
}


document
  .getElementById("sc-close")
  .addEventListener(
    "click",
    closeSensor
  );


/* ============================================================
   NAVEGAÇÃO ENTRE CENAS
   ============================================================ */

function transitionTo(
  targetIndex,
  arriveLon
) {

  closeSensor();


  const flash =
    document.getElementById(
      "flash"
    );


  flash.style.transition =
    "opacity 0.28s ease";

  flash.style.opacity = "1";


  setTimeout(
    function() {

      loadScene(
        targetIndex,
        arriveLon
      );


      setTimeout(
        function() {

          flash.style.opacity = "0";

        },
        60
      );

    },
    260
  );
}


/* ============================================================
   ARRASTAR PANORAMA
   ============================================================ */

let isDragging = false;

let startX = 0;
let startY = 0;

let startLon = 0;
let startLat = 0;


canvas.addEventListener(
  "pointerdown",
  function(e) {

    isDragging = true;

    canvas.classList.add(
      "dragging"
    );

    startX = e.clientX;
    startY = e.clientY;

    startLon = targetLon;
    startLat = targetLat;

  }
);


window.addEventListener(
  "pointerup",
  function() {

    isDragging = false;

    canvas.classList.remove(
      "dragging"
    );

  }
);


window.addEventListener(
  "pointermove",
  function(e) {

    if (!isDragging)
      return;


    const dx =
      e.clientX - startX;

    const dy =
      e.clientY - startY;


    targetLon =
      startLon - dx * 0.12;


    targetLat =
      Math.max(
        -85,
        Math.min(
          85,
          startLat + dy * 0.12
        )
      );

  }
);


/* ============================================================
   ZOOM PELO MOUSE
   ============================================================ */

canvas.addEventListener(
  "wheel",
  function(e) {

    e.preventDefault();


    fovTarget =
      Math.max(
        30,
        Math.min(
          100,
          fovTarget +
          e.deltaY * 0.04
        )
      );

  },
  { passive: false }
);


document
  .getElementById("zoom-in")
  .addEventListener(
    "click",
    function() {

      fovTarget =
        Math.max(
          30,
          fovTarget - 12
        );

    }
  );


document
  .getElementById("zoom-out")
  .addEventListener(
    "click",
    function() {

      fovTarget =
        Math.min(
          100,
          fovTarget + 12
        );

    }
  );


/* ============================================================
   MINIMAPA
   ============================================================ */

document
  .querySelectorAll(".mm-node")
  .forEach(
    function(n) {

      n.addEventListener(
        "click",
        function() {

          const idx =
            Number(
              n.dataset.scene
            );


          if (
            idx !== currentSceneIndex
          ) {

            transitionTo(
              idx,
              SCENES[idx].startLon
            );

          }

        }
      );

    }
  );


/* ============================================================
   LOOP PRINCIPAL
   ============================================================ */

function animate() {

  requestAnimationFrame(
    animate
  );


  lon +=
    (targetLon - lon) *
    0.12;


  lat +=
    (targetLat - lat) *
    0.12;


  if (
    Math.abs(
      fovTarget - fov
    ) > 0.01
  ) {

    fov +=
      (fovTarget - fov) *
      0.1;


    camera.fov =
      fov;


    camera.updateProjectionMatrix();

  }


  const phi =
    THREE.MathUtils.degToRad(
      90 - lat
    );


  const theta =
    THREE.MathUtils.degToRad(
      lon
    );


  const target =
    new THREE.Vector3(

      500 *
      Math.sin(phi) *
      Math.cos(theta),

      500 *
      Math.cos(phi),

      500 *
      Math.sin(phi) *
      Math.sin(theta)

    );


  camera.position.set(
    0,
    0,
    0
  );


  camera.lookAt(
    target
  );


  /* BÚSSOLA */

  document
    .getElementById(
      "compass-needle"
    )
    .style.transform =
      "rotate(" +
      lon +
      "deg)";


  /* HOTSPOTS */

  const s =
    SCENES[
      currentSceneIndex
    ];


  s.hotspots.forEach(
    function(hs) {

      if (!hs._el)
        return;


      const pos =
        lonLatToVector(
          hs.lon,
          hs.lat,
          480
        );


      const projected =
        pos.clone().project(
          camera
        );


      const behind =
        projected.z > 1;


      if (behind) {

        hs._el.style.display =
          "none";

        return;
      }


      const x =
        (
          projected.x *
          0.5 +
          0.5
        ) *
        window.innerWidth;


      const y =
        (
          -projected.y *
          0.5 +
          0.5
        ) *
        window.innerHeight;


      hs._el.style.display =
        "flex";


      hs._el.style.left =
        x + "px";


      hs._el.style.top =
        y + "px";

    }
  );


  renderer.render(
    scene,
    camera
  );
}


/* ============================================================
   INICIAR
   ============================================================ */

window.addEventListener(
  "resize",
  resize
);


window.addEventListener(
  "orientationchange",
  function() {

    setTimeout(
      resize,
      200
    );

  }
);


resize();

loadScene(0);

animate();

</script>
