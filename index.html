<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#0a0a0a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overscroll-behavior:none; }
  #app { position:relative; width:100vw; height:100dvh; }
  #viewer { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #viewer.dragging { cursor:grabbing; }

  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:#fff; background:#0a0a0a; z-index:50;
  }
  .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.15); border-top-color:#e50000; border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .hotspot {
    position:absolute; transform:translate(-50%,-50%); z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; user-select:none; pointer-events:auto;
  }
  .hotspot-ring {
    width:34px; height:34px; border-radius:50%;
    background:#e50000;
    border:2px solid #fff;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition: transform 0.15s ease;
  }
  .hotspot-ring::before {
    content:''; position:absolute; inset:-2px; border-radius:50%;
    border:1.5px solid #e50000; opacity:0.7;
    animation:pulse 1.6s ease-out infinite;
  }
  .hotspot:hover .hotspot-ring { transform:scale(1.15); }
  .hotspot-ring svg { width:14px; height:14px; }
  .hotspot-ring svg path { stroke:#fff !important; }
  @keyframes pulse {
    0% { transform:scale(1); opacity:0.7; }
    100% { transform:scale(2.1); opacity:0; }
  }
  .hotspot-label {
    background:rgba(20,0,0,0.72); color:#fff; padding:4px 10px; border-radius:14px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
    backdrop-filter:blur(3px);
  }

  #hud-top {
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; box-sizing:border-box;
    background:linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    pointer-events:none;
  }
  #hud-top .title { color:#fff; pointer-events:auto; }
  #hud-top .title .eyebrow { font-size:11px; letter-spacing:1.5px; color:#ff6666; font-weight:700; text-transform:uppercase; }
  #hud-top .title .name { font-size:16px; font-weight:700; margin-top:2px; }

  #zoom-controls {
    position:absolute; right:16px; bottom:96px; z-index:30;
    display:flex; flex-direction:column; gap:8px; pointer-events:auto;
  }
  .zbtn {
    width:38px; height:38px; border-radius:10px; border:1px solid rgba(255,255,255,0.18);
    background:rgba(15,15,15,0.6); color:#fff; font-size:19px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .zbtn:active { background:rgba(255,122,26,0.5); }

  #minimap {
    position:absolute; left:16px; bottom:16px; z-index:30;
    width:150px; background:rgba(12,12,12,0.72); border:1px solid rgba(255,255,255,0.15);
    border-radius:12px; padding:10px; backdrop-filter:blur(6px); pointer-events:auto;
  }
  #minimap .mm-title { color:#aaa; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; font-weight:700; }
  .mm-node { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:background 0.15s; }
  .mm-node:last-child{ margin-bottom:0; }
  .mm-node:hover { background:rgba(255,255,255,0.08); }
  .mm-node.active { background:rgba(255,122,26,0.22); border:1px solid rgba(255,122,26,0.55); }
  .mm-dot { width:9px; height:9px; border-radius:50%; background:#555; flex:none; }
  .mm-node.active .mm-dot { background:#e50000; box-shadow:0 0 6px #e50000; }
  .mm-label { color:#eee; font-size:12px; font-weight:600; }

  #compass {
    position:absolute; top:16px; right:16px; z-index:30; pointer-events:none;
    width:52px; height:52px; border-radius:50%;
    background:rgba(12,12,12,0.65); border:1px solid rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  #compass-needle { width:2px; height:20px; background:linear-gradient(#e50000,#e50000 50%,#ddd 50%); transform-origin:center 18px; position:relative; top:-2px; }
  #compass-n { position:absolute; top:4px; color:#e50000; font-size:9px; font-weight:800; }

  #hint {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:25;
    color:rgba(255,255,255,0.65); font-size:11.5px; letter-spacing:0.3px;
    background:rgba(10,10,10,0.45); padding:6px 14px; border-radius:20px;
    pointer-events:none; transition:opacity 0.5s;
  }

  #flash {
    position:absolute; inset:0; background:#e50000; opacity:0; pointer-events:none; z-index:40;
  }

  /* ---------- Responsivo ---------- */
  @media (max-width: 640px) {
    #hud-top { padding:12px 14px; }
    #hud-top .title .eyebrow { font-size:9.5px; letter-spacing:1px; }
    #hud-top .title .name { font-size:13.5px; }

    #compass { width:40px; height:40px; top:12px; right:12px; }
    #compass-needle { height:15px; transform-origin:center 13px; }
    #compass-n { font-size:8px; top:2px; }

    #zoom-controls { right:10px; bottom:130px; gap:6px; }
    .zbtn { width:34px; height:34px; font-size:16px; border-radius:9px; }

    #minimap { left:10px; bottom:10px; width:128px; padding:8px; }
    #minimap .mm-title { font-size:8.5px; margin-bottom:6px; }
    .mm-label { font-size:11px; }
    .mm-node { padding:5px 6px; }

    #hint { bottom:12px; font-size:10px; padding:5px 11px; max-width:80vw; white-space:normal; text-align:center; }

    .hotspot-ring { width:30px; height:30px; }
    .hotspot-ring svg { width:12px; height:12px; }
    .hotspot-label { font-size:10.5px; padding:4px 9px; }
  }

  @media (max-width: 400px) {
    #minimap { width:112px; }
    .mm-label { font-size:10px; }
    #zoom-controls { bottom:150px; }
  }

  /* telas curtas (celular deitado) */
  @media (max-height: 420px) {
    #hud-top { padding:8px 12px; }
    #minimap { display:none; }
    #hint { display:none; }
    #zoom-controls { bottom:14px; }
  }

  /* telas grandes: HUD um pouco maior */
  @media (min-width: 1400px) {
    #hud-top .title .name { font-size:19px; }
    .hotspot-label { font-size:13.5px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading"><div class="spinner"></div><div>Carregando ambiente 360...</div></div>
  <canvas id="viewer"></canvas>
  <div id="flash"></div>

  <div id="hud-top">
    <div class="title">
      <div class="eyebrow">SENAI · Tour Virtual</div>
      <div class="name" id="scene-name">Laboratório de Usinagem</div>
    </div>
  </div>

  <div id="compass"><div id="compass-needle"><span id="compass-n">N</span></div></div>

  <div id="zoom-controls">
    <div class="zbtn" id="zoom-in">+</div>
    <div class="zbtn" id="zoom-out">&minus;</div>
  </div>

  <div id="minimap">
    <div class="mm-title">Pontos do tour</div>
    <div class="mm-node active" data-scene="0"><div class="mm-dot"></div><div class="mm-label">Frente do torno</div></div>
    <div class="mm-node" data-scene="1"><div class="mm-dot"></div><div class="mm-label">Atrás do torno</div></div>
  </div>

  <div id="hint">Arraste para olhar ao redor &nbsp;&bull;&nbsp; toque no ponto laranja para se mover</div>
</div>

// ---- Scene graph: two 360 panoramas linked by hotspots ----
// lon: 0-360 (equirectangular horizontal), lat: -90..90
const SCENES = [
  {
    name: "Frente do torno",
    img: IMG_1,
    startLon: 40,
    hotspots: [
      { lon: 30, lat: -2, label: "Ir para trás do torno", target: 1, targetLon: 195 }
    ]
  },
  {
    name: "Atrás do torno",
    img: IMG_2,
    startLon: 195,
    hotspots: [
      { lon: 195, lat: -3, label: "Voltar para a frente do torno", target: 0, targetLon: 40 }
    ]
  }
];

let currentSceneIndex = 0;
let lon = SCENES[0].startLon, lat = 0;
let targetLon = lon, targetLat = 0;
let fov = 90;

const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(fov, window.innerWidth/window.innerHeight, 0.1, 1000);

const geometry = new THREE.SphereGeometry(500, 60, 40);
geometry.scale(-1,1,1); // view from inside

const loader = new THREE.TextureLoader();
let sphereMesh = null;

function loadScene(index, arriveLon){
  const s = SCENES[index];
  document.getElementById('loading').style.display = 'flex';
  loader.load(s.img, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;
    const material = new THREE.MeshBasicMaterial({ map: texture });
    if (sphereMesh) { scene.remove(sphereMesh); sphereMesh.geometry.dispose(); sphereMesh.material.dispose(); }
    sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);
    document.getElementById('loading').style.display = 'none';
  });
  currentSceneIndex = index;
  lon = targetLon = (arriveLon !== undefined ? arriveLon : s.startLon);
  lat = targetLat = 0;
  document.getElementById('scene-name').textContent = s.name;
  document.querySelectorAll('.mm-node').forEach(n => n.classList.toggle('active', +n.dataset.scene === index));
  renderHotspots();
}

// ---- Hotspot DOM elements projected from 3D lon/lat ----
const hsContainer = document.getElementById('app');
let hotspotEls = [];

function lonLatToVector(lonDeg, latDeg, radius){
  const phi = THREE.MathUtils.degToRad(90 - latDeg);
  const theta = THREE.MathUtils.degToRad(lonDeg);
  const x = radius * Math.sin(phi) * Math.cos(theta);
  const y = radius * Math.cos(phi);
  const z = radius * Math.sin(phi) * Math.sin(theta);
  return new THREE.Vector3(x,y,z);
}

function renderHotspots(){
  hotspotEls.forEach(el => el.remove());
  hotspotEls = [];
  const s = SCENES[currentSceneIndex];
  s.hotspots.forEach(hs => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.innerHTML = '<div class="hotspot-ring"></div><div class="hotspot-label">' + hs.label + '</div>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      transitionTo(hs.target, hs.targetLon);
    });
    hsContainer.appendChild(el);
    hotspotEls.push(el);
    hs._el = el;
  });
}

function transitionTo(targetIndex, arriveLon){
  const flash = document.getElementById('flash');
  flash.style.transition = 'opacity 0.28s ease';
  flash.style.opacity = '1';
  setTimeout(() => {
    loadScene(targetIndex, arriveLon);
    setTimeout(() => { flash.style.opacity = '0'; }, 60);
  }, 260);
}

// ---- Interaction: drag to look around ----
let isDragging = false;
let startX = 0, startY = 0, startLon = 0, startLat = 0;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  canvas.classList.add('dragging');
  startX = e.clientX; startY = e.clientY;
  startLon = targetLon; startLat = targetLat;
});
window.addEventListener('pointerup', () => { isDragging = false; canvas.classList.remove('dragging'); });
window.addEventListener('pointermove', (e) => {
  if(!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  targetLon = startLon - dx * 0.12;
  targetLat = Math.max(-85, Math.min(85, startLat + dy * 0.12));
});

// touch handled by pointer events already; add wheel zoom
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  fov = Math.max(35, Math.min(100, fov + e.deltaY * 0.04));
  camera.fov = fov;
  camera.updateProjectionMatrix();
}, { passive:false });

document.getElementById('zoom-in').addEventListener('click', () => {
  fov = Math.max(35, fov - 10); camera.fov = fov; camera.updateProjectionMatrix();
});
document.getElementById('zoom-out').addEventListener('click', () => {
  fov = Math.min(100, fov + 10); camera.fov = fov; camera.updateProjectionMatrix();
});

document.querySelectorAll('.mm-node').forEach(n => {
  n.addEventListener('click', () => {
    const idx = +n.dataset.scene;
    if (idx !== currentSceneIndex) transitionTo(idx, SCENES[idx].startLon);
  });
});

const hint = document.getElementById('hint');
let hintFaded = false;
canvas.addEventListener('pointerdown', () => {
  if(!hintFaded){ hint.style.opacity = '0'; hintFaded = true; }
});

// ---- Render loop ----
function animate(){
  requestAnimationFrame(animate);
  lon += (targetLon - lon) * 0.12;
  lat += (targetLat - lat) * 0.12;

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  const target = new THREE.Vector3(
    500 * Math.sin(phi) * Math.cos(theta),
    500 * Math.cos(phi),
    500 * Math.sin(phi) * Math.sin(theta)
  );
  camera.position.set(0,0,0);
  camera.lookAt(target);

  // compass needle: yaw relative to lon
  document.getElementById('compass-needle').style.transform = 'rotate(' + (lon) + 'deg)';

  // project hotspots to screen space
  const s = SCENES[currentSceneIndex];
  s.hotspots.forEach(hs => {
    if(!hs._el) return;
    const pos = lonLatToVector(hs.lon, hs.lat, 480);
    const projected = pos.clone().project(camera);
    const behind = projected.z > 1;
    if (behind) { hs._el.style.display = 'none'; return; }
    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
    hs._el.style.display = 'flex';
    hs._el.style.left = x + 'px';
    hs._el.style.top = y + 'px';
  });

  renderer.render(scene, camera);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
loadScene(0);
animate();
</script>
